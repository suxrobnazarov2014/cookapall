<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookpal — Recipe Community</title>
  <meta name="description" content="Cookpal: filter, search and save recipes by diet, allergy, cuisine and goal." />
  <meta property="og:title" content="Cookpal — Recipe Community" />
  <meta property="og:description" content="Filter, search and save recipes by diet, allergy, cuisine and goal." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../public/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- App Shell -->
  <div id="app">
    <!-- Header rendered by JS -->
    <header class="site-header" id="site-header"></header>

    <!-- Main content area -->
    <main id="main-content" class="flex-1"></main>

    <!-- Footer rendered by JS (hidden on supplier page) -->
    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <!-- Cart Drawer -->
  <div id="cart-drawer-root"></div>

  <!-- Checkout Modal -->
  <div id="checkout-modal-root"></div>

  <!-- Data -->
  <script src="data/recipes.js"></script>

  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
